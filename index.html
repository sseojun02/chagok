<style>
:root{--soft:#EEF4FB;--faint:#B8CBE0;--deep:#5A7DA3;--ink:#16181D;--ink2:#3A3F4A;--muted:#5F6673;--line:#E9EAEE;--line2:#F0F1F4;--bg:#F4F5F7}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg)}
body{font-family:'Noto Sans KR',Inter,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font-family:inherit;color:inherit;font-size:inherit}
button{cursor:pointer}
.num{font-family:Inter,'Noto Sans KR',sans-serif}
.shell{position:fixed;left:0;right:0;top:var(--vvt,0px);height:calc(var(--vvh,100dvh) - var(--barh,120px));overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#app{max-width:480px;margin:0 auto}
.main{padding:calc(20px + env(safe-area-inset-top)) 16px 24px;display:flex;flex-direction:column;gap:12px}
.hd{display:flex;align-items:flex-end;justify-content:space-between;padding:8px 4px 4px;gap:10px}
.hd h1{margin:2px 0 0;font-size:27px;font-weight:800;letter-spacing:-.5px}
.sub{font-size:12px;color:var(--muted)}
.card{background:#fff;border-radius:20px;padding:14px 14px 10px;display:flex;flex-direction:column;gap:2px}
.row{display:flex;align-items:center;gap:10px}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.pill{border:0;border-radius:99px;font-weight:700;font-size:12px;padding:8px 13px;background:#fff;color:var(--ink);white-space:nowrap;flex:none}
.pill.on{background:var(--ink);color:#fff}
.pill.line{border:1px solid #D9DCE1;background:#fff;font-weight:500}
.pill.line.on{border-color:var(--ink);background:var(--ink);color:#fff;font-weight:700}
.btn{border:0;border-radius:99px;background:var(--ink);color:#fff;font-weight:700;font-size:13px;padding:10px 14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid #D9DCE1}
.btn.big{width:100%;justify-content:center;border-radius:16px;padding:15px;font-size:15px}
.iconbtn{width:30px;height:30px;border-radius:50%;border:0;background:#F2F3F5;display:flex;align-items:center;justify-content:center;padding:0;flex:none}
.ghd{display:flex;align-items:center;gap:8px;padding:0 0 4px}
.ghd b{font-size:15px;font-weight:800}
.item{display:flex;align-items:center;gap:10px;border-radius:12px;padding:8px;margin:0 -6px}
.item.star{background:var(--soft)}
.item .tt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;text-align:left;border:0;background:transparent;padding:0}
.item .tt span:first-child{font-size:14px;line-height:1.35;word-break:keep-all;overflow-wrap:anywhere}
.item .tt small{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item.done .tt span:first-child{text-decoration:line-through;color:#9A9EA6}
.meta{font-size:11px;font-weight:700;color:var(--muted);flex:none;white-space:nowrap}
.meta.red{color:#B23A1B}
.ck{width:24px;height:24px;border-radius:8px;border:0;background:var(--soft);padding:0;flex:none;display:flex;align-items:center;justify-content:center}
.ck svg{stroke:var(--faint)}
.ck.on{background:var(--deep)}
.ck.on svg{stroke:#fff}
.item.star .ck:not(.on){background:#fff}
.ck.sm{width:20px;height:20px;border-radius:7px}
.starbtn{border:0;background:transparent;padding:2px;flex:none;display:flex}
.tray{background:var(--ink);color:#fff;border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:10px}
.tray .t1{font-size:14px;font-weight:700}
.tray .t2{font-size:12px;color:#B9BDC4;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.warn{background:#FFF1EC;border:0;border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:8px;font-size:13px;color:#A63A1C;text-align:left;width:100%}
.warn span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{background:#fff;border-radius:20px;padding:28px 18px;text-align:center;color:var(--muted);font-size:14px;line-height:1.6}
.linkbtn{border:0;background:transparent;display:flex;align-items:center;gap:6px;justify-content:center;font-size:12px;color:var(--muted);padding:6px;width:100%}
.shopg{display:flex;flex-direction:column;gap:2px;background:#F7F8FA;border-radius:12px;padding:6px 10px;margin:2px 0 6px}
.shopg h6{margin:4px 0 2px;font-size:11px;color:var(--muted);font-weight:700}
.shopi{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:13px}
.shopi.done span{text-decoration:line-through;color:#9A9EA6}
.bar{position:fixed;left:0;right:0;top:calc(var(--vvt,0px) + var(--vvh,100dvh) - var(--barh,120px));z-index:10;background:#fff;border-top:1px solid #E6E8EB;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.bar .in{max-width:456px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.inp{display:flex;align-items:center;gap:8px;background:#F2F3F5;border-radius:14px;padding:4px 4px 4px 12px}
.inp input{flex:1;border:0;background:transparent;font-size:15px;outline:none;min-width:0;padding:8px 0}
.inp button{width:36px;height:36px;border-radius:12px;border:0;background:var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.tabs{display:flex;justify-content:space-around}
.tabs button{border:0;background:transparent;font-size:11px;color:#6B7079;display:flex;flex-direction:column;align-items:center;gap:3px;padding:2px 8px;min-width:52px}
.tabs button.on{color:var(--ink);font-weight:800}
.tabs svg{stroke:currentColor}
.mc-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.mc-dow{text-align:center;font-size:12px;font-weight:600;color:var(--muted);padding:0 0 6px}
.mc-c{height:58px;border:0;border-top:1px solid var(--line2);background:transparent;padding:4px 0 0;display:flex;flex-direction:column;align-items:center;gap:3px}
.mc-n{width:26px;height:26px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.mc-c.sel .mc-n{background:var(--ink);color:#fff!important}
.mc-c.out{opacity:.35}
.mc-d{display:flex;gap:3px;height:7px;align-items:center}
.mc-d i{width:5px;height:5px;border-radius:3px;display:block}
.mc-d i.ring{width:5px;height:5px;background:#fff!important;box-shadow:inset 0 0 0 1.5px var(--c)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:0 2px}
.chips::-webkit-scrollbar{display:none}
.hero{border-radius:22px;padding:20px;color:#fff;display:flex;flex-direction:column;gap:12px}
.hero .b{font-size:12px;font-weight:700;background:rgba(255,255,255,.22);padding:4px 10px;border-radius:99px}
.prog{height:8px;background:rgba(255,255,255,.3);border-radius:99px;overflow:hidden}
.prog i{display:block;height:8px;background:#fff;border-radius:99px}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.wk div{border-radius:12px;padding:8px 0;display:flex;flex-direction:column;gap:3px;align-items:center}
.wk div.on{background:var(--ink);color:#fff}
.sheetbg{position:fixed;left:0;right:0;top:var(--vvt,0px);height:var(--vvh,100dvh);background:rgba(22,24,29,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;border-radius:26px 26px 0 0;width:100%;max-width:480px;max-height:calc(var(--vvh,100dvh) - 24px);overscroll-behavior:contain;overflow:auto;padding:10px 20px calc(24px + env(safe-area-inset-bottom))}
.grab{width:40px;height:4px;border-radius:2px;background:#D9DCE1;margin:0 auto 12px}
.fl{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line2);font-size:14px}
.fl>label,.fl>.lab{font-size:13px;font-weight:700;width:64px;flex:none}
.fld{border:1px solid #D9DCE1;border-radius:12px;padding:10px 12px;font-size:15px;outline:none;background:#fff;width:100%}
input[type=date].fld{padding:8px 10px;font-size:14px;width:auto}
.tg{width:44px;height:26px;border-radius:13px;background:#D9DCE1;position:relative;border:0;padding:0;flex:none}
.tg i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.tg.on{background:var(--ink)}
.tg.on i{left:21px}
.sw{width:32px;height:32px;border-radius:50%;border:0;padding:0}
.sw.on{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--c)}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--vvt,0px) + var(--vvh,100dvh) - var(--barh,120px) - 60px);background:var(--ink);color:#fff;font-size:13px;padding:12px 14px 12px 16px;border-radius:16px;z-index:40;display:flex;align-items:center;gap:12px;max-width:calc(100% - 32px);width:max-content}
.toast button{border:0;background:transparent;color:#9FC4EE;font-weight:700;font-size:13px;padding:0;white-space:nowrap}
.pal{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pal button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0;border-radius:14px;border:1.5px solid transparent;background:transparent;font-size:12px}
.pal button.on{border-color:var(--ink);background:#F2F3F5;font-weight:700}
.pal span.b{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.plan-day{display:flex;flex-direction:column;gap:6px}
.plan-day .st{display:flex;align-items:center;gap:8px;background:#F7F8FA;border-radius:12px;padding:6px 10px}
.plan-day .st input{flex:1;border:0;background:transparent;font-size:13px;outline:none;min-width:0;padding:4px 0}
.upd{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top));z-index:50;background:var(--ink);color:#fff;border-radius:16px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:10px;font-size:13px;box-shadow:0 8px 24px rgba(22,24,29,.18);width:max-content;max-width:calc(100% - 24px)}
.upd b{font-weight:700}
.upd .go{border:0;border-radius:99px;background:#fff;color:var(--ink);font-weight:700;font-size:12px;padding:8px 12px}
.upd .x{border:0;background:transparent;color:#9A9EA6;padding:4px;display:flex}
/* iOS: 16px 미만 입력칸을 누르면 화면이 확대되므로 모든 입력칸 16px 이상 */
input,select,textarea{font-size:16px!important}
html{-webkit-text-size-adjust:100%}
/* 키보드가 열리면 탭바는 숨기고 입력칸만 키보드 바로 위에 */
body.kb .tabs{display:none}
body.kb .bar{padding-bottom:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--deep);outline-offset:2px}
</style>
</head>
<body>
<div class="shell"><div id="app"></div></div>
<div class="bar" id="bar"><div class="in">
  <form class="inp" id="qf" autocomplete="off">
    <input id="qi" placeholder="그냥 적으세요 · 분류는 알아서 해요" aria-label="할 일 적기" enterkeyhint="done">

  </form>
  <nav class="tabs" id="tabs"></nav>
</div></div>
<div id="sheet"></div>
<div id="toast"></div>
<div id="upd"></div>
<script>
(function () {
'use strict';

/* ---------- Firebase 설정: 콘솔의 firebaseConfig 값을 여기에 붙여넣으세요 (비어 있으면 이 기기에만 저장) ---------- */
var FIREBASE_CONFIG = {
  apiKey: "AIzaSyC87d7tjPX7hTzfK5RawoTss9v9KkJzXp0",
  authDomain: "chagok-92157.firebaseapp.com",
  projectId: "chagok-92157",
  storageBucket: "chagok-92157.firebasestorage.app",
  messagingSenderId: "420644429062",
  appId: "1:420644429062:web:4a81d6248d117332fed287"
};
var COLLECTION = 'chagok_users';
var LS_KEY = 'chagok-v1';
var APP_VER = (document.querySelector('meta[name=app-version]') || {}).content || 'dev';

/* ---------- 상수 ---------- */
var PAL = [
  ['하늘', '#EEF4FB', '#B8CBE0', '#5A7DA3'],
  ['민트', '#EAF5EF', '#B5D6C4', '#4E8C6D'],
  ['라벤더', '#F1EEFA', '#C9C0E6', '#7466A8'],
  ['피치', '#FFEEE4', '#FFC6A8', '#F7925F'],
  ['레몬', '#FFF8D4', '#F9E07C', '#F2BC1B'],
  ['로즈', '#FFEBF2', '#FAB8CF', '#F0739F'],
  ['라일락 그레이', '#F1F1F5', '#C7C8D3', '#6C6E80'],
  ['검정', '#F2F3F5', '#C9CCD2', '#17181A']
];
var TCOL = ['#2E9E6A', '#3B6FE0', '#7A5AE0', '#D9603F', '#D9921E', '#D2508A', '#16857A', '#9AA0AA'];
var TPL = {
  '프로젝트': {due: true, count: true, prog: true, hide: false},
  '과목': {due: true, count: true, prog: false, hide: false},
  '생활': {due: false, count: false, prog: false, hide: true}
};
var LIFE = 'life';
var DOWS = '일월화수목금토';
var STORES = ['다이소', '쿠팡', '올리브영', '이마트', '홈플러스', '코스트코', '트레이더스', '롯데마트', '편의점', 'GS25', 'CU', '세븐일레븐', '마트', '시장', '약국', '무신사', '네이버', '컬리', '마켓컬리', '알리', '테무', '문구점', '교보문고', '다이소몰', '스타벅스'];
var ONLINE = ['쿠팡', '무신사', '네이버', '컬리', '마켓컬리', '알리', '테무', '다이소몰'];

/* ---------- 날짜 ---------- */
function pad(n) { return (n < 10 ? '0' : '') + n; }
function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function parseD(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function todayS() { return ymd(new Date()); }
function addDays(s, n) { var d = parseD(s); d.setDate(d.getDate() + n); return ymd(d); }
function diff(a, b) { return Math.round((parseD(b) - parseD(a)) / 864e5); }
function dow(s) { return parseD(s).getDay(); }
function md(s) { var d = parseD(s); return (d.getMonth() + 1) + '/' + d.getDate(); }
function mdw(s) { return md(s) + ' ' + DOWS[dow(s)]; }
function longDate(s) { var d = parseD(s); return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + DOWS[d.getDay()] + '요일'; }

/* ---------- 자동 분류 (규칙 파서) ---------- */
/* PARSER-START */
function resolveDay(day, base) {
  var b = parseD(base), d = new Date(b.getFullYear(), b.getMonth(), day);
  if (d.getMonth() !== b.getMonth()) return null;
  if (ymd(d) < base) d = new Date(b.getFullYear(), b.getMonth() + 1, day);
  return ymd(d);
}
function resolveMD(m, day, base) {
  var b = parseD(base), d = new Date(b.getFullYear(), m - 1, day);
  if (diff(ymd(d), base) > 60) d = new Date(b.getFullYear() + 1, m - 1, day);
  return ymd(d);
}
function resolveDow(w, base, mode) {
  var b = parseD(base), cur = b.getDay();
  if (mode === 'next') {
    var mon = addDays(base, -((cur + 6) % 7) + 7);
    return addDays(mon, (w + 6) % 7);
  }
  if (mode === 'this') {
    var mon2 = addDays(base, -((cur + 6) % 7));
    return addDays(mon2, (w + 6) % 7);
  }
  var add = (w - cur + 7) % 7;
  return addDays(base, add);
}
function parseSeg(s, base, topics) {
  var r = {raw: s, title: s, topic: null, newTopic: null, date: base, due: null, rep: null, shop: false, store: '', items: [], why: []};
  var t = ' ' + s + ' ';
  var m;
  /* 주제: #이름 / 기존 주제 이름 / 맨 앞 영어 대문자 약어 */
  if ((m = t.match(/\s#(\S+)/))) {
    var nm = m[1];
    var ex = topics.filter(function (x) { return x.name.toLowerCase() === nm.toLowerCase(); })[0];
    if (ex) r.topic = ex.id; else r.newTopic = nm;
    t = t.replace(m[0], ' ');
    r.why.push('‘' + nm + '’ 주제');
  } else {
    var best = null;
    topics.forEach(function (x) {
      if (x.id === LIFE || x.name.length < 2) return;
      if (t.toLowerCase().indexOf(x.name.toLowerCase()) >= 0 && (!best || x.name.length > best.name.length)) best = x;
    });
    if (best) {
      r.topic = best.id;
      var re = new RegExp('\\s' + best.name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(의|에서|에|\\s)', 'i');
      if (re.test(t) && t.trim().toLowerCase().indexOf(best.name.toLowerCase()) === 0) t = t.replace(re, ' ');
      r.why.push('‘' + best.name + '’ 주제 인식');
    } else if ((m = t.match(/\s([A-Z][A-Z0-9]{1,7})(?=\s)/)) && !/^(PPT|PDF|SNS|OK|PC|TV|ATM|DM|URL|PT|ID|PW|QR|USB|CV)$/.test(m[1])) {
      r.newTopic = m[1];
      t = t.replace(m[0], ' ');
      r.why.push('새 주제 ‘' + m[1] + '’ 만듦');
    }
  }
  /* 반복 */
  var w, days;
  if ((m = t.match(/\s(매일|날마다|하루\s?한\s?번)(씩)?/))) { r.rep = {t: 'daily'}; t = t.replace(m[0], ' '); }
  else if ((m = t.match(/\s평일(마다|에)?/))) { r.rep = {t: 'weekdays'}; t = t.replace(m[0], ' '); }
  else if ((m = t.match(/\s주말(마다|에)?/))) { r.rep = {t: 'weekly', days: [6, 0]}; t = t.replace(m[0], ' '); }
  else if ((m = t.match(/\s(매주|주마다)\s*((?:[월화수목금토일](?:요일)?\s*[,·、/]?\s*(?:랑|이랑|하고|와|과|,)?\s*)+)(마다|에)?/))) {
    days = [];
    m[2].replace(/요일/g, '').replace(/[월화수목금토일]/g, function (c) { var i = DOWS.indexOf(c); if (days.indexOf(i) < 0) days.push(i); });
    r.rep = {t: 'weekly', days: days}; t = t.replace(m[0], ' ');
  } else if ((m = t.match(/\s((?:[월화수목금토일]\s*[,·]?\s*){1,6})요일마다/))) {
    days = [];

/* ---------- 화면 높이: 키보드가 올라와도 위 화면은 그대로, 남은 공간만 사용 ---------- */
function toTop() { var sh = document.querySelector('.shell'); if (sh) sh.scrollTop = 0; }
function fitViewport() {
  var vv = window.visualViewport, h = vv ? vv.height : window.innerHeight, t = vv ? vv.offsetTop : 0;
  var r = document.documentElement.style, bar = document.getElementById('bar');

  r.setProperty('--barh', (bar.style.display === 'none' ? 0 : bar.offsetHeight) + 'px');

  if (e.target.closest && e.target.closest('#bar')) { document.body.classList.add('kb'); fitViewport(); setTimeout(fitViewport, 300); }
});
document.addEventListener('focusout', function (e) {
  if (e.target.closest && e.target.closest('#bar')) setTimeout(function () { if (!document.activeElement || !document.activeElement.closest || !document.activeElement.closest('#bar')) { document.body.classList.remove('kb'); window.scrollTo(0, 0); fitViewport(); } }, 50);

/* iOS: 입력칸을 누를 때 페이지 전체를 끌어올리는 기본 동작 막기 — 스크롤 없이 포커스만,
   그다음 키보드에 가리지 않을 만큼만 그 칸을 살짝 보이게 */
(function () {
  function typable(el) { return el && (el.tagName === 'TEXTAREA' || (el.tagName === 'INPUT' && !/^(date|checkbox|radio|button|submit|file|range|color)$/.test(el.type))); }
  function reveal(el) {
    [250, 500].forEach(function (ms) { setTimeout(function () { if (document.activeElement === el && el.id !== 'qi') try { el.scrollIntoView({block: 'nearest'}); } catch (x) {} }, ms); });
  }
  document.addEventListener('touchend', function (e) {
    var el = e.target;
    if (!typable(el) || document.activeElement === el) return;
    e.preventDefault();
    try { el.focus({preventScroll: true}); } catch (x) { el.focus(); }
    reveal(el);
  }, {passive: false, capture: true});
  document.addEventListener('mousedown', function (e) {
    var el = e.target;
    if (e.target.id === 'qi' && document.activeElement !== el) { e.preventDefault(); try { el.focus({preventScroll: true}); } catch (x) { el.focus(); } }
  });
})();
/* iOS가 페이지 전체를 밀어 올리는 것 되돌리기 */
window.addEventListener('scroll', function () { if (window.scrollY) window.scrollTo(0, 0); });

/* ---------- 새 버전 알림 ---------- */
var updSeen = '';
function checkUpdate() {
  if (!/^https?:/.test(location.protocol) || APP_VER === 'dev') return;
  fetch(location.pathname + '?nc=' + Date.now(), {cache: 'no-store'}).then(function (r) { return r.ok ? r.text() : ''; }).then(function (txt) {
    var m = txt && txt.match(/<meta name="app-version" content="([^"]+)">/);
    if (!m || m[1] === APP_VER || m[1] === updSeen) return;
    showUpdate(m[1]);
  }).catch(function () {});
}
function showUpdate(ver) {
  var el = document.getElementById('upd');
  el.innerHTML = '<div class="upd" role="status"><span><b>새 버전</b>이 있어요</span><button class="go" data-upd="go">업데이트</button><button class="x" data-upd="later" aria-label="나중에">' + ico('<path d="M6 6l12 12M18 6L6 18"/>', 14) + '</button></div>';
  el.onclick = function (e) {
    var b = e.target.closest('[data-upd]'); if (!b) return;
    if (b.getAttribute('data-upd') === 'go') { flush(); setTimeout(function () { location.replace(location.pathname + '?v=' + encodeURIComponent(ver)); }, 300); }
    else { updSeen = ver; el.innerHTML = ''; }
  };
}
setInterval(checkUpdate, 5 * 60 * 1000);
document.addEventListener('visibilitychange', function () { if (!document.hidden) checkUpdate(); });
